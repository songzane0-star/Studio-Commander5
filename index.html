}
function artHash(value){return [...String(value)].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,7);}
function artPortrait(name){
  const h=artHash(name),hair=['#62473f','#3e3f55','#805440','#57434b','#a27144'][h%5],shirt=['#789bef','#64c3bb','#ffb968','#ef9fae','#9c96e8'][h%5],bg=['#e7edff','#ddf5ee','#fff0d0','#ffe6ec','#ece7ff'][h%5];
  const long=h%3===0,glasses=h%4===0;
  return `<svg class="art-portrait" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="19" fill="${bg}"/><path d="M12 64v-8c0-19 40-19 40 0v8" fill="${shirt}"/><path d="m26 46 6 9 6-9" fill="#ffddb8"/>${long?`<path d="M14 27c0-27 37-27 37 0l2 24H12Z" fill="${hair}"/>`:''}<ellipse cx="32" cy="29" rx="17" ry="20" fill="${hair}"/><circle cx="15" cy="34" r="4" fill="#ffcda7"/><circle cx="49" cy="34" r="4" fill="#ffcda7"/><rect x="17" y="19" width="30" height="29" rx="14" fill="#ffdbb9"/><path d="M15 29c-2-18 12-24 23-20 10 2 12 12 10 20-7-2-11-9-12-12-5 8-14 10-21 12Z" fill="${hair}"/><circle cx="25" cy="33" r="1.7" fill="#473b42"/><circle cx="39" cy="33" r="1.7" fill="#473b42"/><ellipse cx="21" cy="38" rx="3" ry="1.7" fill="#f2aaa0" opacity=".7"/><ellipse cx="43" cy="38" rx="3" ry="1.7" fill="#f2aaa0" opacity=".7"/><path d="M28 40q4 4 8 0" fill="none" stroke="#b77d70" stroke-width="1.6" stroke-linecap="round"/>${glasses?'<g fill="none" stroke="#4c5871" stroke-width="1.5"><rect x="19" y="29" width="11" height="9" rx="3"/><rect x="34" y="29" width="11" height="9" rx="3"/><path d="M30 32h4"/></g>':''}<path d="M23 54v10m18-10v10" stroke="#fff" stroke-opacity=".25" stroke-width="2"/></svg>`;
}
function artHTML(tag,className,html){const n=document.createElement(tag);n.className=className;n.innerHTML=html;return n;}
function decorateArtTemplate(root){
  root.querySelectorAll('.office').forEach(office=>{
    const img=document.createElement('img');img.src=STUDIO_ART;img.alt='伙伴们一起开发游戏的卡通工作室';img.className='studio-scene-image';img.decoding='async';img.width=1280;img.height=720;
    office.replaceChildren(img,artHTML('span','scene-caption','<i></i> 灵感正在变成游戏'),artHTML('span','scene-sticker',artIcon('game')));
  });
  root.querySelectorAll('.guide-icon').forEach(el=>{el.className='welcome-scene';const img=document.createElement('img');img.src=STUDIO_ART;img.alt='欢迎来到造梦游戏社';img.width=1280;img.height=720;el.replaceChildren(img);});
  root.querySelectorAll('.dash-card').forEach((card,i)=>{card.dataset.resource=String(i);card.prepend(artHTML('span','resource-icon',artIcon(['coin','rocket','star','people'][i])));});
  root.querySelectorAll('.team-card').forEach((card,i)=>{
    card.dataset.department=String(i);const title=card.querySelector('.team-title');if(title){const text=title.textContent.replace(/^\S+\s/,'');title.replaceChildren(artHTML('span','department-icon',artIcon(['brush','terminal','megaphone','bulb'][i])),document.createTextNode(text));}
    const box=card.querySelector('.leader-box'),name=box?.querySelector('.leader-name')?.textContent;if(box&&name)box.prepend(artHTML('span','leader-portrait',artPortrait(name)));
    card.querySelectorAll('.staff-item').forEach(row=>{const avatar=row.querySelector('.staff-avatar');if(avatar)avatar.innerHTML=artPortrait(row.querySelector('.staff-name')?.textContent);});
  });
  root.querySelectorAll('.candidate-card').forEach((card,i)=>{const p=card.querySelector('.candidate-avatar');if(p){p.innerHTML=artPortrait(card.querySelector('.candidate-name')?.textContent||i);p.classList.add('candidate-portrait');}});
  root.querySelectorAll('.result-box').forEach(box=>{const name=box.querySelector('.result-name')?.firstChild?.textContent,p=box.querySelector('.result-avatar');if(p&&name){p.innerHTML=artPortrait(name);p.classList.add('candidate-portrait');}});
  root.querySelectorAll('.hr-staff-item,.pm-staff-item').forEach(row=>{const p=row.querySelector('.hr-staff-avatar,.pm-staff-avatar'),name=row.querySelector('.hr-staff-name,.pm-staff-name')?.textContent;if(p&&name)p.innerHTML=artPortrait(name);});
  root.querySelectorAll('.team-mini').forEach((row,i)=>{const p=row.querySelector('span');if(p)p.innerHTML=artIcon(['brush','terminal','megaphone','bulb'][i]);});
  root.querySelectorAll('.milestone i').forEach((el,i)=>{el.innerHTML=artIcon(el.parentElement.classList.contains('done')?'check':['people','bulb','rocket','game','star'][i]);});
  root.querySelectorAll('.project-btn').forEach((btn,i)=>{const first=btn.querySelector('.project-btn-icon');if(first)first.innerHTML=artIcon(['game','rocket','star','people','bulb','chart'][i]);});
  root.querySelectorAll('.personnel-pair>div,.handover-person').forEach(el=>{const p=el.querySelector('span'),name=el.querySelector('b')?.textContent;if(p&&name&&!['岗位空缺','新伙伴','归档完成'].includes(name))p.innerHTML=artPortrait(name);});
  root.querySelectorAll('.personnel-new').forEach(el=>{const p=el.querySelector('span');if(p)p.innerHTML=artPortrait(el.querySelector('b')?.textContent?.split(' · ')[0]);});
}
function installStudioArt(){
  document.documentElement.dataset.artVersion='4';
  const projects=document.querySelector('#projectGrid');if(projects)decorateArtTemplate(projects);
  const brand=document.querySelector('.brand');brand.innerHTML=`<span class="brand-badge">${artIcon('game')}</span><span>造梦游戏社<small>DREAM STUDIO</small></span>`;
  document.querySelector('.header-left h1').innerHTML=`<span class="header-brand-icon">${artIcon('game')}</span>造梦游戏社<span class="studio-tag">创业物语</span>`;
  document.querySelectorAll('[data-view]').forEach((b,i)=>{const labels=['工作室','我的团队','市场发行','成长记录'];b.innerHTML=`${artIcon(['game','people','megaphone','chart'][i])}<span>${labels[i]}</span>`;});
  const foot=document.querySelector('.nav-foot');foot.innerHTML=`<div class="nav-trophy">${artIcon('star')}</div><b>下一款好游戏，由你创造</b><span>24周 · 从小工作室出发</span><div class="nav-mini-stars">✦ ✦ ✦</div>`;
}

setupStudio();
installStudioMotion();
installStudioArt();
try{const candidate=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(validSave(candidate))savedGame=candidate;}catch(e){}
originalRestart();

</script>
