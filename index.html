<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏公司经理人（增强版）- 市场调研/广告投放/24周考核</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
#main { max-width: 1400px; margin: 0 auto; }
h1 { text-align: center; font-size: 24px; color: white; margin-bottom: 8px; }
.subtitle { text-align: center; color: rgba(255,255,255,0.9); font-size: 14px; margin-bottom: 16px; }
.header-card {
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  border-radius: 12px; padding: 20px; margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-left {
  flex: 1;
}
.credits-btn {
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}
.credits-btn:hover {
  background: rgba(255,255,255,0.3);
  border-color: rgba(255,255,255,0.6);
  transform: scale(1.05);
}
.credits-btn:active {
  transform: scale(0.98);
}
.credits-modal {
  background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
  border-radius: 16px;
  padding: 32px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}
.credits-modal-avatar {
  font-size: 72px;
  margin-bottom: 16px;
  animation: creditsBounce 2s ease-in-out infinite;
}
@keyframes creditsBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-8px) rotate(5deg); }
  75% { transform: translateY(-8px) rotate(-5deg); }
}
.credits-modal-title {
  font-size: 24px;
  font-weight: 700;
  color: white;
  margin-bottom: 24px;
}
.credits-modal-item {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
}
.credits-modal-label {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 4px;
}
.credits-modal-value {
  font-size: 18px;
  font-weight: 600;
  color: #fbbf24;
}
.credits-modal-wechat {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #07c160;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  margin-top: 8px;
}
.credits-modal-close {
  margin-top: 20px;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  color: white;
  border: none;
  padding: 12px 32px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
}
.credits-modal-close:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}
.dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 800px) { .dashboard { grid-template-columns: repeat(2, 1fr); } }
.dash-card { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.dash-label { font-size: 13px; color: #6b7280; }
.dash-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
.dash-value.indigo { color: #6366f1; }
.dash-value.green { color: #10b981; }
.dash-value.orange { color: #f59e0b; }
.dash-value.blue { color: #3b82f6; }
.dash-value.red { color: #ef4444; }

/* 资金血条卡片 */
.fund-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.fund-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.fund-title { font-size: 16px; font-weight: 600; color: #1f2937; display: flex; align-items: center; gap: 8px; }
.fund-status { font-size: 13px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
.fund-status.healthy { background: #dcfce7; color: #166534; }
.fund-status.warning { background: #fef3c7; color: #92400e; }
.fund-status.danger { background: #fee2e2; color: #991b1b; }
.fund-bar-container { position: relative; height: 28px; background: #f3f4f6; border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.fund-bar { height: 100%; border-radius: 14px; transition: width 0.5s ease-out, background 0.3s; }
.fund-bar.healthy { background: linear-gradient(90deg, #10b981, #34d399); }
.fund-bar.warning { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.fund-bar.danger { background: linear-gradient(90deg, #ef4444, #f87171); }
.fund-bar-text { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 13px; font-weight: 600; color: #374151; text-shadow: 0 0 4px white; }
.fund-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
@media (max-width: 600px) { .fund-details { grid-template-columns: repeat(2, 1fr); } }
.fund-detail-item { padding: 8px; background: #f9fafb; border-radius: 6px; }
.fund-detail-label { font-size: 11px; color: #6b7280; margin-bottom: 2px; }
.fund-detail-value { font-size: 14px; font-weight: 600; color: #1f2937; }

/* 最后两个月考核卡片 */
.final-assessment-card { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.final-assessment-title { font-size: 18px; font-weight: 700; color: #92400e; margin-bottom: 12px; text-align: center; }
.final-assessment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 600px) { .final-assessment-grid { grid-template-columns: repeat(2, 1fr); } }
.final-assessment-item { background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px; text-align: center; }
.final-assessment-label { font-size: 12px; color: #78350f; margin-bottom: 4px; }
.final-assessment-values { display: flex; justify-content: center; gap: 8px; align-items: center; }
.final-assessment-current { font-size: 16px; font-weight: 700; color: #1f2937; }
.final-assessment-target { font-size: 12px; color: #6b7280; }
.final-assessment-status { font-size: 11px; margin-top: 4px; padding: 2px 8px; border-radius: 4px; }
.final-assessment-status.pass { background: #dcfce7; color: #166534; }
.final-assessment-status.fail { background: #fee2e2; color: #991b1b; }

.progress-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
.progress-bar { height: 12px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 6px; transition: width 0.3s; }

.status-bar { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; font-size: 14px; }
.status-bar b { margin-right: 6px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; border: 1px solid #d1d5db; background: #f9fafb; color: #374151; }
.badge.green { background: #dcfce7; border-color: #86efac; color: #166534; }
.badge.red { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
.badge.blue { background: #dbeafe; border-color: #93c5fd; color: #1e40af; }
.badge.orange { background: #fef3c7; border-color: #fcd34d; color: #92400e; }

/* 达标成就卡片 */
.achievement-card { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); border: 2px solid #22c55e; border-radius: 12px; padding: 20px; margin-bottom: 16px; text-align: center; animation: achievementPop 0.5s ease-out; }
@keyframes achievementPop { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
.achievement-icon { font-size: 48px; margin-bottom: 8px; animation: bounce 1s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.achievement-title { font-size: 20px; font-weight: 700; color: #166534; margin-bottom: 8px; }
.achievement-text { font-size: 14px; color: #15803d; }
.achievement-stats { display: flex; justify-content: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.achievement-stat { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #166534; }
.achievement-stat-icon { font-size: 16px; }

.teams-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .teams-grid { grid-template-columns: 1fr; } }
.team-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.team-header { background: linear-gradient(135deg, #f1f5f9 0%, #f8fafc 100%); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.team-title { font-size: 16px; font-weight: 600; }
.team-count { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.team-count.normal { background: #e5e7eb; color: #374151; }
.team-count.warning { background: #fef3c7; color: #92400e; }
.team-count.danger { background: #fee2e2; color: #991b1b; }
.team-content { padding: 16px; }
.leader-box { background: #f8fafc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.leader-name { font-weight: 600; font-size: 16px; }
.leader-level { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; margin-left: 6px; color: white; }
.leader-ability { font-size: 13px; color: #6b7280; margin-left: 12px; }
.leader-adv { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
.adv-tag { padding: 2px 6px; border: 1px solid #e5e7eb; border-radius: 3px; font-size: 11px; color: #6b7280; }
.leader-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.team-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; font-size: 13px; }
.stat-item { display: flex; justify-content: space-between; }
.stat-value.green { color: #10b981; font-weight: 600; }
.stat-value.red { color: #ef4444; font-weight: 600; }
.stat-value.orange { color: #f59e0b; font-weight: 600; }

/* 部门产出指示器 */
.team-output { margin-bottom: 12px; padding: 10px; background: #f0fdf4; border-radius: 8px; border: 1px solid #bbf7d0; }
.team-output-title { font-size: 12px; color: #166534; font-weight: 600; margin-bottom: 6px; }
.team-output-bars { display: flex; flex-direction: column; gap: 4px; }
.output-bar-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.output-bar-label { width: 60px; color: #374151; }
.output-bar-track { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
.output-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.output-bar-fill.good { background: #10b981; }
.output-bar-fill.medium { background: #f59e0b; }
.output-bar-fill.poor { background: #ef4444; }
.output-bar-value { width: 40px; text-align: right; font-weight: 600; }

.staff-list { max-height: 150px; overflow-y: auto; border-top: 1px solid #e5e7eb; }
.staff-item { display: flex; align-items: center; gap: 4px; padding: 6px 0; border-bottom: 1px solid #f3f4f6; font-size: 12px; }
.staff-avatar { font-size: 18px; width: 24px; text-align: center; }
.staff-name { font-weight: 600; min-width: 50px; }
.staff-level { padding: 1px 4px; border-radius: 2px; font-size: 10px; color: white; }
.staff-workload { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.staff-sat { min-width: 40px; text-align: right; }
.staff-loyalty { min-width: 35px; text-align: right; font-size: 11px; }

.btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: #6366f1; color: white; }
.btn.primary:hover:not(:disabled) { background: #4f46e5; }
.btn.outline { background: white; border: 1px solid #d1d5db; color: #374151; }
.btn.outline:hover:not(:disabled) { background: #f9fafb; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.xs { padding: 2px 6px; font-size: 11px; min-width: 20px; }
.btn.recruit { width: 100%; margin-bottom: 12px; }
.btn.fire { color: #ef4444; padding: 2px 6px; font-size: 11px; }
.btn.train { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
.btn.train:hover:not(:disabled) { background: #bfdbfe; }

/* 工作量调整按钮增强样式 */
.btn.workload-btn { 
  min-width: 24px; 
  height: 24px; 
  border-radius: 4px;
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
.btn.workload-btn:hover:not(:disabled) {
  transform: scale(1.1);
}
.btn.workload-btn:active:not(:disabled) {
  transform: scale(0.95);
}
.btn.workload-minus { 
  background: linear-gradient(135deg, #fef3c7, #fde68a); 
  border: 1px solid #f59e0b;
  color: #92400e;
}
.btn.workload-minus:hover:not(:disabled) { 
  background: linear-gradient(135deg, #fde68a, #fcd34d);
}
.btn.workload-plus { 
  background: linear-gradient(135deg, #dbeafe, #bfdbfe); 
  border: 1px solid #3b82f6;
  color: #1e40af;
}
.btn.workload-plus:hover:not(:disabled) { 
  background: linear-gradient(135deg, #bfdbfe, #93c5fd);
}

/* 工作量数值显示 */
.workload-value {
  min-width: 45px;
  text-align: center;
  font-weight: 600;
  font-size: 12px;
  color: #374151;
  padding: 2px 4px;
  border-radius: 4px;
  transition: all 0.2s ease;
}
.workload-value.changed {
  animation: workloadPulse 0.3s ease;
}
@keyframes workloadPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); background: #fef3c7; }
  100% { transform: scale(1); }
}

/* 员工项目高亮效果 */
.staff-item:hover {
  background: #f0f9ff;
}
.staff-item.adjusting {
  animation: staffHighlight 0.5s ease;
}
@keyframes staffHighlight {
  0% { background: #fef3c7; }
  100% { background: transparent; }
}

/* 工作量快捷调整提示 */
.workload-hint {
  font-size: 10px;
  color: #6b7280;
  text-align: center;
  padding: 4px;
  background: #f3f4f6;
  border-radius: 4px;
  margin-top: 4px;
}

/* 员工状态指示器 */
.staff-status-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}
.staff-status-indicator.good { background: #10b981; }
.staff-status-indicator.warning { background: #f59e0b; }
.staff-status-indicator.danger { background: #ef4444; }

/* 消息提示 Toast */
.toast-message {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30, 41, 59, 0.95);
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 5000;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

.features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .features-grid { grid-template-columns: 1fr; } }
.feature-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.feature-header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; }
.feature-title { font-size: 16px; font-weight: 600; }
.feature-content { padding: 16px; }

/* 市场调研效果展示 */
.research-effect { margin-top: 12px; padding: 12px; background: #eff6ff; border-radius: 8px; border: 1px solid #bfdbfe; }
.research-effect-title { font-size: 13px; font-weight: 600; color: #1e40af; margin-bottom: 8px; }
.research-effect-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.research-effect-icon { font-size: 16px; }
.research-effect-text { color: #1e40af; }
.research-effect-value { font-weight: 600; color: #1d4ed8; margin-left: auto; }

.test-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.test-btn { display: flex; flex-direction: column; align-items: center; padding: 12px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; cursor: pointer; transition: all 0.2s; position: relative; }
.test-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #6366f1; }
.test-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.test-btn.has-bonus::after { content: '✓'; position: absolute; top: 4px; right: 4px; background: #22c55e; color: white; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; }
.test-icon { font-size: 24px; margin-bottom: 4px; }
.test-name { font-size: 13px; font-weight: 500; }
.test-cost { font-size: 11px; color: #6b7280; }
.test-result { background: #f8fafc; border-radius: 6px; padding: 10px; font-size: 13px; }
.test-result-title { font-weight: 500; margin-bottom: 4px; }
.test-result-insight { font-size: 12px; color: #6b7280; }

/* 广告投放 */
.strategy-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.strategy-btns { display: flex; gap: 8px; margin-bottom: 8px; }
.strategy-btn { flex: 1; padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.strategy-btn.active { background: #6366f1; color: white; }
.strategy-btn:not(.active) { background: #f1f5f9; border: 1px solid #e5e7eb; }
.strategy-hint { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
.channel-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: #f8fafc; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
.channel-icon { font-size: 18px; }
.channel-name { flex: 1; font-weight: 500; }
.channel-toggle { padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.channel-toggle.on { background: #6366f1; color: white; }
.channel-toggle.off { background: #e5e7eb; color: #6b7280; }
.channel-budget { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.channel-budget input { width: 70px; padding: 2px 4px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
.ad-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding: 10px; background: #eff6ff; border-radius: 6px; text-align: center; }
.preview-item .label { font-size: 11px; color: #6b7280; }
.preview-item .value { font-size: 16px; font-weight: 700; }
.preview-item .value.blue { color: #3b82f6; }
.preview-item .value.green { color: #10b981; }
.preview-item .value.orange { color: #f59e0b; }

.action-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.action-card .btn { margin: 0 6px; }

/* 推进下周大按钮 */
.next-week-btn {
  font-size: 20px !important;
  padding: 16px 48px !important;
  border-radius: 12px !important;
  font-weight: 700 !important;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%) !important;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
  transition: all 0.3s ease !important;
  animation: btnPulse 2s ease-in-out infinite;
}
.next-week-btn:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
  50% { box-shadow: 0 4px 30px rgba(99, 102, 241, 0.6); }
}

.project-select-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.project-select-title { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #1f2937; }

/* 成就系统样式 */
.achievement-banner {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
  border: 3px solid #f59e0b;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  text-align: center;
  animation: achievementBannerPop 0.6s ease-out;
  position: relative;
  overflow: hidden;
}
.achievement-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: achievementShine 2s ease-in-out;
}
@keyframes achievementBannerPop {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes achievementShine {
  0% { transform: translateX(-100%) rotate(45deg); }
  100% { transform: translateX(100%) rotate(45deg); }
}
.achievement-banner-icon { font-size: 56px; margin-bottom: 12px; animation: achievementIconBounce 1s ease-in-out infinite; }
@keyframes achievementIconBounce {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.1) rotate(5deg); }
}
.achievement-banner-title { font-size: 22px; font-weight: 700; color: #92400e; margin-bottom: 8px; }
.achievement-banner-desc { font-size: 14px; color: #78350f; }

// ====== 工具函数 ======
function shuffleArray(arr) {
  let a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateLeaderCandidates(dept, avoidAbility = []) {
  // 领导等级概率分布：S级非常稀缺
  // S: 5%, A: 20%, B: 40%, C: 35%
  const levelProbs = [
    {level: "S", prob: 0.05},
    {level: "A", prob: 0.20},
    {level: "B", prob: 0.40},
    {level: "C", prob: 0.35}
  ];
  
  let candidates = [];
  let usedAbility = avoidAbility.slice();
  let namePool = shuffleArray(LEADER_NAMES_POOL);
  
  for (let i = 0; i < 5; i++) {
    // 按概率选择等级
    let r = Math.random();
    let cumulative = 0;
    let selectedLevel = LEADER_LEVELS[3]; // 默认C级
    
    for (let lp of levelProbs) {
      cumulative += lp.prob;
      if (r < cumulative) {
        selectedLevel = LEADER_LEVELS.find(l => l.level === lp.level);
        break;
      }
    }
    
    // 如果该能力值已被使用，选择其他可用的
    let availableLevels = LEADER_LEVELS.filter(lv => !usedAbility.includes(lv.ability));
    if (availableLevels.length > 0 && !availableLevels.includes(selectedLevel)) {
      // 按概率从可用等级中重新选择
      let availableProbs = levelProbs.filter(lp => availableLevels.some(al => al.level === lp.level));
      let r2 = Math.random();
      let cumulative2 = 0;
      for (let lp of availableProbs) {
        cumulative2 += lp.prob;
        if (r2 < cumulative2) {
          selectedLevel = availableLevels.find(al => al.level === lp.level);
          break;
        }
      }
      if (!selectedLevel || !availableLevels.includes(selectedLevel)) {
        selectedLevel = availableLevels[Math.floor(Math.random() * availableLevels.length)];
      }
    }
    
    usedAbility.push(selectedLevel.ability);
    
    let advs = [];
    let advPool = LEADER_ADV.slice();
    for (let j = 0; j < 2; j++) advs.push(advPool.splice(Math.floor(Math.random() * advPool.length), 1)[0]);
    
    candidates.push({
      name: namePool[i], level: selectedLevel.level, ability: selectedLevel.ability, color: selectedLevel.color,
      dept: dept, morale: 0, adv: advs, cost: LEADER_COST[selectedLevel.level]
    });
  }
  return candidates;
}

function getUniqueStaffName() {
  let pool = STAFF_NAMES_POOL.filter(n => !staffNamesUsed.includes(n));
  if (pool.length === 0) {
    let base = ["安","白","蔡","丁","杜","范","高","郭","贾","江","金","孔","雷","梁","廖","林","罗","马","孟","倪","彭","秦","邱","石","孙","唐","田","王","吴","谢","杨","于","余","张","周"];
    let given = ["涛","伟","刚","磊","鹏","斌","凯","静","莉","琳","婷","雪","颖","燕","敏","丹","萍","倩","悦","蕾","妍","楠","琪","璐","洁","佳","欣","宁","媛","凡","佳","宇"];
    for (let i = 0; i < 30; i++) STAFF_NAMES_POOL.push(base[Math.floor(Math.random() * base.length)] + given[Math.floor(Math.random() * given.length)]);
    pool = STAFF_NAMES_POOL.filter(n => !staffNamesUsed.includes(n));
  }
  let name = pool[Math.floor(Math.random() * pool.length)];
  staffNamesUsed.push(name);
  return name;
}

function getStaffLevelByCost(leader, cost) {
  // 员工等级概率分布：S级非常稀缺
  // 成本越低，S/A级概率越低
  let probSets = {
    5000:  {S: 0.005, A: 0.04,  B: 0.25,  C: 0.705},  // 低成本：S几乎不可能
    10000: {S: 0.02,  A: 0.10,  B: 0.35,  C: 0.53},   // 中等成本：S很稀有
    20000: {S: 0.06,  A: 0.20,  B: 0.40,  C: 0.34},   // 高成本：S较少
    50000: {S: 0.12,  A: 0.30,  B: 0.38,  C: 0.20}    // 最高成本：S较少但仍稀缺
  };
  let prob = Object.assign({}, probSets[cost] || probSets[10000]);
  // 领导加成：优秀领导略微提升高级员工概率
  if (leader) {
    if (leader.level === "S") { prob.S += 0.02; prob.A += 0.03; prob.C -= 0.03; }
    else if (leader.level === "A") { prob.S += 0.01; prob.A += 0.02; prob.C -= 0.02; }
    else if (leader.level === "B") { prob.A += 0.01; prob.B += 0.01; prob.C -= 0.01; }
  }
  // 确保概率不出现负数
  prob.C = Math.max(0, prob.C);
  let r = Math.random(), sum = 0, lvIdx = 0, lvArr = ["S","A","B","C"];
  for (let i = 0; i < 4; i++) { sum += prob[lvArr[i]]; if (r < sum) { lvIdx = i; break; } }
  return STAFF_LEVELS[lvIdx];
}

  let loyalty = Math.min(100, Math.max(30, baseLoyalty + personality.loyaltyMod + Math.floor(Math.random() * 10)));
  // 添加个性类型用于显示

}

function calcTeamMorale(teamIdx) {
  const base = 60;
  let leader = leaders[teamIdx];
  let leaderBonus = leader ? (leader.level === "S" ? 10 : leader.level === "A" ? 6 : leader.level === "B" ? 3 : 0) : 0;
  let avgAbility = teams[teamIdx].length ? teams[teamIdx].reduce((sum, s) => sum + s.effect, 0) / teams[teamIdx].length : 0;
  let staffBonus = avgAbility * 10;
  let leaderMorale = leader ? leader.morale || 0 : 0;
  let morale = base + leaderBonus + staffBonus + leaderMorale;
  if (adStrategy === 'aggressive') morale -= 5;
  else if (adStrategy === 'conservative') morale += 2;
  return Math.max(0, Math.min(100, morale));
}

function refreshAllMorale() {
  for (let i = 0; i < 4; i++) teamMorale[i] = calcTeamMorale(i);
}

function calcStaffSaturation(staff) { return staff.workload / staff.effect * 100; }

function calcAdEffect() {
  let activeChannels = adChannels.filter(c => c.active && c.budget > 0);
  if (activeChannels.length === 0) return { efficiency: 0.5, reach: 0, cost: 0 };
  let totalBudget = activeChannels.reduce((sum, c) => sum + c.budget, 0);
  let weightedEfficiency = activeChannels.reduce((sum, c) => sum + c.efficiency * (c.budget / totalBudget), 0);
  let totalReach = activeChannels.reduce((sum, c) => sum + c.reach * (c.budget / c.baseCost), 0);
  let efficiencyMod = adStrategy === 'aggressive' ? 1.2 : adStrategy === 'conservative' ? 0.9 : 1;
  return { efficiency: weightedEfficiency * efficiencyMod, reach: Math.floor(totalReach), cost: totalBudget };
}

// ====== 随机事件系统 ======
function triggerRandomEvent() {
  // 30%概率触发随机事件
  if (Math.random() > 0.3) {
    currentRandomEvent = null;
    return null;
  }
  
  // 选择事件类型权重
  let weights = { positive: 40, neutral: 30, negative: 30 };
  let rand = Math.random() * 100;
  let type;
  if (rand < weights.positive) type = 'positive';
  else if (rand < weights.positive + weights.neutral) type = 'neutral';
  else type = 'negative';
  
  let candidates = RANDOM_EVENTS.filter(e => e.type === type);
  currentRandomEvent = candidates[Math.floor(Math.random() * candidates.length)];
  return currentRandomEvent;
}

function applyRandomEventEffect(event) {
  if (!event || !event.effect) return;
  
  let effect = event.effect;
  if (effect.money) {
    money = Math.max(0, money + effect.money);
    addLog(`📊 随机事件「${event.name}」：${effect.money > 0 ? '+' : ''}${effect.money.toLocaleString()} 资金`);
  }
  // 其他效果在calculateWeekData中处理
}

function getRandomEventCard() {
  if (!currentRandomEvent) return '';
  let e = currentRandomEvent;
  let typeColor = e.type === 'positive' ? '#22c55e' : e.type === 'negative' ? '#ef4444' : '#6b7280';
  return `
    <div class="random-event-card" style="background: linear-gradient(135deg, ${e.type === 'positive' ? '#22c55e, #16a34a' : e.type === 'negative' ? '#ef4444, #dc2626' : '#6366f1, #4f46e5'});">
      <div class="random-event-header">
        <div class="random-event-icon">${e.icon}</div>

        <div class="random-event-effect-value">${e.effectText}</div>
      </div>
    </div>
  `;
}

function renderDiagnose() {
  if (diagnoseArr.length === 0 || !teamOutputs) { document.getElementById("diagnoseCard").style.display = "none"; return; }
  
  let std = TYPE_STANDARDS[PROJECT_TYPES[projectTypeIdx].name];
  let html = `<div class="diagnose-title">🔍 项目问题诊断与改进建议</div>`;
  
  for (let i = 0; i < TEAMS.length; i++) {
    // 跳过人事部门（索引4）和PM部门（索引5）
    if (i === 4 || i === 5) continue;
    
    let output = teamOutputs[i];
    let problems = [];
    let solutions = [];
    
    if (output.efficiency < 0.6) {
      problems.push("团队效率过低，产出不足");
      solutions.push("考虑招聘更高等级员工或培训现有员工");
    }
    if (output.efficiency >= 0.6 && output.efficiency < 0.8) {
      problems.push("团队效率一般，有提升空间");
      solutions.push("可通过施压/鼓励或培训提升效率");
    }
    if (teams[i].length < TEAMS[i].base * 0.8) {
      problems.push(`人手不足（${teams[i].length}/${TEAMS[i].base}人）`);
      solutions.push("招聘更多员工分担工作");
    }
    if (teamMorale[i] < 50) {
      problems.push("士气低落，影响产出质量");
      solutions.push("鼓励领导、控制工作量或进行团队建设");
    }
    
    // 根据部门类型给出特定建议
    if (i === 0 && output.output < 0.7) { // 美术
      problems.push("美术产出影响游戏品质和留存");
      solutions.push("增加美术人手或培训提升技能");
    }
    if (i === 1 && output.output < 0.7) { // 程序
      problems.push("程序产出影响开发进度和稳定性");
      solutions.push("招聘高级程序员或减少工作量压力");
    }
    if (i === 2 && output.output < 0.7) { // 发行
      problems.push("发行产出影响买量成本和ROI");
      solutions.push("增加广告投放预算或优化投放策略");
    }
    if (i === 3 && output.output < 0.7) { // 策划
      problems.push("策划产出影响游戏设计和付费转化");
      solutions.push("进行定价策略测试或鼓励策划创新");
    }
    
    if (problems.length > 0) {
      html += `<div class="diagnose-dept">
        <div class="diagnose-dept-title"><span class="diagnose-dept-icon">${TEAMS[i].icon}</span>${TEAMS[i].name}部门</div>
        <ul class="diagnose-dept-problems">${problems.map(p => `<li>${p}</li>`).join('')}</ul>
        <div class="diagnose-dept-solutions">
          <div class="diagnose-dept-solutions-title">💡 改进建议</div>
          <ul class="diagnose-dept-solutions-list">${solutions.map(s => `<li>• ${s}</li>`).join('')}</ul>
        </div>
      </div>`;
    }
  }
  
  document.getElementById("diagnoseCard").innerHTML = html;
  document.getElementById("diagnoseCard").style.display = "block";
}

// ====== 月度会议 ======
function showMonthlyMeeting(monthNum) {
  let std = TYPE_STANDARDS[PROJECT_TYPES[projectTypeIdx].name];
  let monthHistory = history.filter((h, i) => Math.floor(i / 4) === monthNum);
  
  // 重置本月市场测试限制
  if (currentMonth !== monthNum) {
    currentMonth = monthNum;
    monthlyMarketTestsUsed = {audience:false, competitor:false, trend:false, pricing:false};
  }
  
  // 计算各部门表现
  let deptStats = [];
  for (let i = 0; i < 4; i++) {
    let output = teamOutputs ? teamOutputs[i] : { efficiency: 0.5, output: 0.5 };
    let status = output.efficiency >= 0.8 ? 'good' : output.efficiency >= 0.6 ? 'warning' : 'poor';
    let problems = [];
    if (output.efficiency < 0.6) problems.push("效率严重不足");
    if (teams[i].length < TEAMS[i].base * 0.8) problems.push("人手短缺");
    if (teamMorale[i] < 50) problems.push("士气低落");
    deptStats.push({ efficiency: output.efficiency, status, problems });
  }
  
  // 市场分析
  let marketInsight = hasDoneMarketResearch.trend ? 
    "市场趋势分析已完成，建议针对用户偏好进行产品优化。" : 
    "尚未进行市场趋势分析，建议尽快了解市场动向。";
  
  // 竞品分析
  let competitorInsight = hasDoneMarketResearch.competitor ?
    "竞品分析已完成，可参考竞品优势改进产品。" :
    "尚未进行竞品分析，建议了解竞争对手动态。";
  
  // 计算月度平均值
  let avgProgress = monthHistory.length > 0 ? monthHistory.reduce((s, h) => s + h.progress, 0) / monthHistory.length : 0;
  let avgQuality = monthHistory.length > 0 ? monthHistory.reduce((s, h) => s + h.quality, 0) / monthHistory.length : 0;
  let avgROI = monthHistory.length > 0 ? monthHistory.reduce((s, h) => s + h.roi, 0) / monthHistory.length : 0;
  let avgD1 = monthHistory.length > 0 ? monthHistory.reduce((s, h) => s + h.d1, 0) / monthHistory.length : 0;
  
  // 收集所有问题
  let allProblems = [];
  let allSuggestions = [];
  
  if (avgProgress < (monthNum + 1) * 4.17) { allProblems.push("项目进度落后于计划"); allSuggestions.push("增加工作量或招聘更多人手"); }
  if (avgQuality < std.Quality) { allProblems.push("研发质量未达标"); allSuggestions.push("培训员工或鼓励团队提升品质"); }
  if (avgROI < std.ROI) { allProblems.push("ROI不达标"); allSuggestions.push("优化广告投放策略或进行市场调研"); }
  if (avgD1 < std.D1) { allProblems.push("次日留存不达标"); allSuggestions.push("进行用户画像测试优化产品设计"); }
  if (!hasDoneMarketResearch.audience) { allSuggestions.push("建议进行用户画像测试了解目标用户"); }
  if (!hasDoneMarketResearch.pricing) { allSuggestions.push("建议进行定价策略测试优化付费转化"); }
  
  // 分析离职动向
  pendingResignations = [];
  for (let i = 0; i < 4; i++) {

function handleResignAction(action, idx) {
  if (idx >= pendingResignations.length) {
    // 处理完毕
    showResignActionModal();
    return;
  }
  
  let emp = pendingResignations[idx];
  
  switch(action) {
    case 'raise':
      // 提薪安抚
      let raiseCost = 8000 + Math.floor(emp.staff.effect * 2000);
      if (money >= raiseCost) {
        money -= raiseCost;
        emp.staff.loyalty = Math.min(100, emp.staff.loyalty + 25);
        emp.staff.hasResignWarning = true;
        addLog(`💰 对${emp.staff.name}提薪安抚，忠诚度+25`);
        // 从列表中移除
        pendingResignations.splice(idx, 1);
        // 更新后续索引
        for (let i = idx; i < pendingResignations.length; i++) {
          if (pendingResignations[i].teamIdx === emp.teamIdx && pendingResignations[i].staffIdx > emp.staffIdx) {
            pendingResignations[i].staffIdx--;
          }
        }
      } else {
        alert("资金不足！");
        return;
      }
      break;
      
    case 'accept':
      // 同意离职
      let compens = 5000 + Math.floor(emp.staff.effect * 3000);
      money -= compens;
      teams[emp.teamIdx].splice(emp.staffIdx, 1);
      addLog(`😢 ${emp.staff.name}离职，支付赔偿金¥${compens.toLocaleString()}`);
      pendingResignations.splice(idx, 1);
      // 更新后续索引
      for (let i = idx; i < pendingResignations.length; i++) {
        if (pendingResignations[i].teamIdx === emp.teamIdx && pendingResignations[i].staffIdx > emp.staffIdx) {
          pendingResignations[i].staffIdx--;
        }
      }
      break;
  }
  
  render();
  
  // 更新界面或关闭
  if (pendingResignations.length > 0) {
    showResignActionModal();
  } else {
    closeMeeting();
  }
}

// 批量处理所有离职意向
function handleAllResign(action) {
  if (action === 'raise') {
    // 计算总费用
    let totalCost = pendingResignations.reduce((sum, emp) => sum + 8000 + Math.floor(emp.staff.effect * 2000), 0);
    if (money < totalCost) {
      alert(`资金不足！需要 ¥${totalCost.toLocaleString()}`);
      return;
    }
    
    // 执行提薪
    let processedCount = 0;
    for (let emp of pendingResignations) {
      let raiseCost = 8000 + Math.floor(emp.staff.effect * 2000);
      money -= raiseCost;
      emp.staff.loyalty = Math.min(100, emp.staff.loyalty + 25);
      emp.staff.hasResignWarning = true;
      processedCount++;
    }
    addLog(`💰 批量提薪安抚 ${processedCount} 名员工，共花费 ¥${totalCost.toLocaleString()}`);
    pendingResignations = [];
  }
  
  render();
  closeMeeting();
}

function animateWeekProgress() {
  const progressBar = document.getElementById("weekProgressBar");

  const statusMessages = ["正在计算团队产出...", "美术团队正在进行设计工作", "程序团队正在编写代码", "发行团队正在进行市场推广", "策划团队正在优化玩法", "正在评估项目进度...", "正在计算市场表现...", "正在统计用户数据...", "正在结算收益...", "本周结算完成！"];
  let progress = 0, statusIndex = 0, stepIndex = 0;
  const interval = setInterval(() => {
    progress += 2;
    progressBar.style.width = progress + "%";
    if (progress % 10 === 0 && statusIndex < statusMessages.length) { statusText.textContent = statusMessages[statusIndex]; statusIndex++; }
    if (progress >= 25 && stepIndex === 0) { steps[0].classList.add('active'); stepIndex = 1; }

    else if (progress >= 75 && stepIndex === 2) { steps[2].classList.add('active'); stepIndex = 3; }

    if (progress >= 100) { clearInterval(interval); statusText.classList.remove('typing'); setTimeout(showWeekResult, 300); }
  }, 50);

// ====== 核心计算 ======
function calculateWeekData() {
  let planInc = 100 / WEEKS;
  let newPlanProgress = Math.min(100, (history.length + 1) * planInc);
  
  // 团队效率计算
  let ratios = [], avgEffects = [], leaderBonus = [], effs = [];
  for (let i = 0; i < 4; i++) {
    ratios[i] = teams[i].reduce((sum, s) => sum + s.workload, 0) / TEAMS[i].base;
    avgEffects[i] = teams[i].length > 0 ? teams[i].reduce((sum, s) => sum + s.effect, 0) / teams[i].length : 1;
    leaderBonus[i] = leaders[i] ? leaders[i].ability : 1;
    effs[i] = avgEffects[i] * leaderBonus[i] * Math.min(ratios[i], 1.5) * (teams[i].length / TEAMS[i].base);
  }
  
  let pressureBonus = leaderPressureFlag.map(f => f ? 1.05 : 1).reduce((a, b) => a * b, 1);
  let encourageBonus = leaderEncourageFlag.map(f => f ? 1.08 : 1).reduce((a, b) => a * b, 1);
  let latestMarketTest = marketTests.length > 0 ? marketTests[marketTests.length - 1] : null;
  let marketTestBonus = latestMarketTest ? 1 + (latestMarketTest.score / 800) : 1;
  let adEffect = calcAdEffect();
  
  // PM部门增益
  let pmEfficiencyBonus = 1 + (pmBonuses.efficiency || 0) / 100;
  let pmCoordinationBonus = 1 + (pmBonuses.coordination || 0) / 100;
  
  // 进度计算
  let baseProgress = 2.5;
  let progInc = (baseProgress + effs[0] * 0.4 + effs[1] * 0.45 + effs[2] * 0.25 + effs[3] * 0.35 + (Math.random() - 0.5) * 0.6) * pressureBonus * marketTestBonus * pmEfficiencyBonus * pmCoordinationBonus;
  progInc = Math.min(progInc, 6.5);
  
  // 质量计算
  let baseQuality = 0.04;
  let qualInc = (baseQuality + effs[0] * 0.018 + effs[1] * 0.018 + effs[3] * 0.025 + (Math.random() - 0.5) * 0.06) * encourageBonus * pmCoordinationBonus;
  qualInc = Math.max(0.02, Math.min(qualInc, 0.35));
  
  let newProgress = Math.min(100, project.progress + progInc);
  let newQuality = Math.min(10, project.quality + qualInc);
  let progressRate = Math.min(1, newProgress / (newPlanProgress || 1));
  
  // 下载数量
  let baseDownload = 2000 + Math.floor(Math.random() * 2000);
  baseDownload += Math.floor(effs[0] * 600 + effs[1] * 500 + effs[2] * 1200 + effs[3] * 400);
  baseDownload = Math.floor(baseDownload * progressRate);
  baseDownload += Math.floor(adEffect.reach * adEffect.efficiency * 0.5);
  
  // 买量成本
  let costBase = 1.8 - Math.min(effs[2] * 0.15, 0.5);
  let buyCost = Math.floor(baseDownload * costBase * (0.9 + Math.random() * 0.3));
  buyCost = Math.floor(buyCost * (1 - adEffect.efficiency * 0.12));
  buyCost = Math.max(10000, buyCost);
  
  // 付费用户
  let conversionRate = 0.02 + effs[0] * 0.004 + effs[1] * 0.003 + effs[3] * 0.005;
  conversionRate = Math.min(0.08, conversionRate);
  let payUser = Math.floor(baseDownload * conversionRate);
  if (hasDoneMarketResearch.pricing) payUser = Math.floor(payUser * 1.12);
  
  // 广告成本与收益
  let adCost = Math.floor(effs[2] * 150 + Math.random() * 1500 + adEffect.cost);
  let avgRevenue = payUser * 15 + baseDownload * 0.5;
  let revenue = Math.floor(avgRevenue * progressRate);
  revenue = Math.floor(revenue * (0.8 + adEffect.efficiency * 0.25));
  
  // ROI
  let roi = revenue / (buyCost + adCost + 1);
  
  // 次日留存
  let d1 = 0.15 + effs[0] * 0.015 + effs[1] * 0.012 + effs[2] * 0.01 + effs[3] * 0.018 + newQuality * 0.02;
  d1 += (Math.random() - 0.5) * 0.04;
  if (hasDoneMarketResearch.audience) d1 += 0.025;
  d1 = Math.max(0.12, Math.min(0.55, d1));
  
  // 记录各部门产出
  teamOutputs = effs.map((eff, i) => ({
    efficiency: Math.min(eff / 2, 1),
    output: Math.min((eff * teamMorale[i] / 100), 1)
  }));
  
  weekResultData = {
    planProgress: newPlanProgress, progress: newProgress, quality: newQuality,
    download: Math.floor(baseDownload), buyCost, payUser, adCost,
    adBudget: adEffect.cost, revenue, roi, d1,
    adEffectCost: adEffect.cost, progInc, qualInc,
    teamEffs: effs
  };
}

function applyWeekData() {
  if (!weekResultData) return;
  
  project.planProgress = weekResultData.planProgress;
  project.progress = weekResultData.progress;
  project.quality = weekResultData.quality;
  if (weekResultData.adEffectCost > 0) money -= weekResultData.adEffectCost;
  
  history.push({
    planProgress: weekResultData.planProgress, progress: weekResultData.progress,
    quality: weekResultData.quality, download: weekResultData.download,
    buyCost: weekResultData.buyCost, payUser: weekResultData.payUser,
    adCost: weekResultData.adCost, adBudget: weekResultData.adBudget,
    revenue: weekResultData.revenue, roi: weekResultData.roi, d1: weekResultData.d1
  });
  
  // 诊断
  diagnoseArr = [];
  let std = TYPE_STANDARDS[PROJECT_TYPES[projectTypeIdx].name];
  let h = weekResultData;
  if (h.progress < h.planProgress) diagnoseArr.push("进度落后于计划");
  if (h.quality < std.Quality) diagnoseArr.push("研发质量偏低");
  if (h.roi < std.ROI) diagnoseArr.push("ROI不达标");
  if (h.buyCost > std.BuyCost) diagnoseArr.push("买量成本偏高");
  if (h.payUser < std.PayUser) diagnoseArr.push("付费用户不达标");
  if (h.d1 < std.D1) diagnoseArr.push("次日留存偏低");
  
  // 重置每周状态
  transferBudget = MONTH_BUDGET_TRANSFER;
  recruitBudget = MONTH_BUDGET_RECRUIT;
  leaderActionTimes = [1, 1, 1, 1];
  leaderEncourageTimes = [1, 1, 1, 1];
  leaderPressureFlag = [false, false, false, false];
  leaderEncourageFlag = [false, false, false, false];
  
  teams.forEach(t => t.forEach(s => s.workMonths++));
  refreshAllMorale();
  
  // 最终考核判定（取最后8周平均）
  if (history.length >= WEEKS) {
    running = false;
    let finalWeeks = history.slice(-8);
    let avgProgress = finalWeeks.reduce((s, h) => s + h.progress, 0) / 8;
    let avgQuality = finalWeeks.reduce((s, h) => s + h.quality, 0) / 8;
    let avgROI = finalWeeks.reduce((s, h) => s + h.roi, 0) / 8;
    let avgD1 = finalWeeks.reduce((s, h) => s + h.d1, 0) / 8;
    let avgBuyCost = finalWeeks.reduce((s, h) => s + h.buyCost, 0) / 8;
    let avgPayUser = finalWeeks.reduce((s, h) => s + h.payUser, 0) / 8;
    
    let ok = avgProgress >= 100 && avgQuality >= std.Quality && avgROI >= std.ROI && avgBuyCost <= std.BuyCost && avgPayUser >= std.PayUser && avgD1 >= std.D1;
    addLog(ok ? `<span class="green" style="font-weight:bold">🎉 项目成功！最终考核平均达标！</span>` : `<span class="red" style="font-weight:bold">😢 项目失败，最终考核未达标。</span>`);
  }
  
  // 检查员工忠诚度，收集离职意向（统一在月末会议后处理）
  // 清空之前的离职意向
  pendingResignations = [];
  for (let i = 0; i < 4; i++) {
    for (let j = teams[i].length - 1; j >= 0; j--) {
      let staff = teams[i][j];
      // 工作强度过高降低忠诚度
      let workloadSat = calcStaffSaturation(staff);
      if (workloadSat > 120) {
        staff.loyalty = Math.max(20, staff.loyalty - 3);
      }
      // 如果忠诚度过低，加入离职意向列表
      if (staff.loyalty < 60) {
        let risk = calculateResignRisk(staff, i);
        pendingResignations.push({
          teamIdx: i,
          staffIdx: j,
          staff: staff,
          risk: risk
        });
      }
    }
  }
  // 按风险排序
  pendingResignations.sort((a, b) => b.risk.score - a.risk.score);
  
  weekResultData = null;
}

function doMarketTest(testType) {
  let testInfo = MARKET_TEST_TYPES.find(t => t.id === testType);
  if (!testInfo || money < testInfo.cost) { alert("资金不足！"); return; }
  
  // 检查本月是否已使用过
  if (monthlyMarketTestsUsed[testType]) {
    alert(`⚠️ ${testInfo.name}本月已使用过，请等待下月重置！`);
    return;
  }
  
  // 先扣款并标记本月已使用
  money -= testInfo.cost;
  monthlyMarketTestsUsed[testType] = true;
  hasDoneMarketResearch[testType] = true;
  
  // 显示遮罩
  let mask = document.getElementById('marketTestMask');
  mask.classList.add('show');
  
  // 设置标题和图标
  document.getElementById('marketTestIcon').textContent = testInfo.icon;
  document.getElementById('marketTestTitle').textContent = testInfo.name;
  document.getElementById('marketTestSubtitle').textContent = `正在${testInfo.name}，花费 ¥${testInfo.cost.toLocaleString()}...`;
  
  // 生成测试步骤
  const steps = [
    {icon: "📡", text: "数据采集", status: "等待中" },
    {icon: "🔄", text: "数据清洗", status: "等待中" },
    {icon: "📊", text: "模型分析", status: "等待中" },
    {icon: "📈", text: "生成报告", status: "等待中" },
    {icon: "✅", text: "完成验证", status: "等待中" }
  ];
  
  document.getElementById('marketTestSteps').innerHTML = steps.map((s, i) => `
    <div class="market-test-step" id="marketTestStep${i}">
      <div class="market-test-step-icon">${s.icon}</div>
      <div class="market-test-step-text">${s.text}</div>
      <div class="market-test-step-status" id="marketTestStatus${i}">${s.status}</div>
        </div>
  `).join('');
  
  // 隐藏结果区域
  document.getElementById('marketTestResult').classList.remove('show');
  
  // 开始动画
  let progress = 0;
  const progressBar = document.getElementById('marketTestProgressBar');
  
  const testInterval = setInterval(() => {
    progress += 1;
    progressBar.style.width = progress + '%';
    
    // 更新步骤状态
    for (let i = 0; i < steps.length; i++) {
      let stepEl = document.getElementById(`marketTestStep${i}`);
      let statusEl = document.getElementById(`marketTestStatus${i}`);
      
      let threshold = (i + 1) * 100 / steps.length;
      
      if (progress >= threshold && !stepEl.classList.contains('done')) {
        stepEl.classList.add('done');
        statusEl.textContent = '✅ 完成';
        
        if (i < steps.length - 1) {
          document.getElementById(`marketTestStep${i + 1}`).classList.add('active');
        }
      }
    }
    
    // 完成后生成结果
    if (progress >= 100) {
      clearInterval(testInterval);
      setTimeout(() => {
        generateMarketTestResult(testType, testInfo);
      }, 500);
    }
  }, 30);
}

// HR半月报告 - 检测离职风险
function generateHRReport() {
  if (!hrDepartment) {
    alert("请先建立HR部门！");
    return;
  }
  
  let currentWeek = history.length;
  let currentBiweek = Math.floor(currentWeek / 2);
  
  // 检查是否已经在这个半月报告过
  if (lastHRReportWeek === currentBiweek) {
    alert("本半月已生成过HR报告！");
    return;
  }
  
  lastHRReportWeek = currentBiweek;
  
  // 分析所有员工
  pendingResignations = [];
  let riskEmployees = [];
  
  for (let i = 0; i < 4; i++) { // 只检查前4个团队（不含HR自己）
    for (let j = 0; j < teams[i].length; j++) {
      let staff = teams[i][j];
      let risk = calculateResignRisk(staff, i);
      
      if (risk.level !== 'low') {
        riskEmployees.push({
          teamIdx: i,
          staffIdx: j,
          staff: staff,
          risk: risk
        });
      }
    }
  }
  
  // 按风险排序
  riskEmployees.sort((a, b) => b.risk.score - a.risk.score);
  
  // 生成报告
  let report = {
    week: currentWeek,
    riskCount: riskEmployees.length,
    highRisk: riskEmployees.filter(e => e.risk.level === 'high').length,
    mediumRisk: riskEmployees.filter(e => e.risk.level === 'medium').length,
    employees: riskEmployees.slice(0, 10) // 最多显示10个
  };
  
  hrReports.push(report);
  
  // 显示报告弹窗
  showHRReportModal(report);
}

// 计算离职风险
function calculateResignRisk(staff, teamIdx) {
  let score = 0;
  let reasons = [];
  
  // 忠诚度因素
  if (staff.loyalty < 40) {
    score += 40;
    reasons.push("忠诚度过低");
  } else if (staff.loyalty < 60) {
    score += 25;
    reasons.push("忠诚度偏低");
  } else if (staff.loyalty < 70) {
    score += 10;
    reasons.push("忠诚度略低");
  }
  
  // 工作强度因素
  let sat = calcStaffSaturation(staff);
  if (sat > 150) {
    score += 30;
    reasons.push("工作严重超负荷");
  } else if (sat > 120) {
    score += 15;
    reasons.push("工作强度偏高");
  }
  
  // 性格因素
  if (staff.personality) {
    if (staff.personality.name === "野心勃勃" && staff.level === "C") {
      score += 15;
      reasons.push("对现状不满");
    }
    if (staff.personality.name === "敏感脆弱") {
      score += 10;
      reasons.push("心理承受力较弱");
    }
  }
  
  // 工作时长
  if (staff.workMonths > 4 && staff.level === "C") {
    score += 10;
    reasons.push("长期未晋升");
  }
  
  // 团队士气
  if (teamMorale[teamIdx] < 40) {
    score += 15;
    reasons.push("团队士气低落");
  }
  
  let level = 'low';
  if (score >= 50) level = 'high';
  else if (score >= 25) level = 'medium';
  
  return { score, level, reasons };
}

// 生成员工反馈
function generateStaffFeedback(staff, teamIdx) {
  let moods = [];
  let suggestions = [];
  
  // 基于忠诚度的心态
  if (staff.loyalty < 50) {
    moods.push("最近感觉压力很大，有点喘不过气来...");
    moods.push("我觉得自己可能不太适合这份工作...");
    moods.push("最近经常加班，感觉身心俱疲...");
  } else if (staff.loyalty < 70) {
    moods.push("工作还行吧，就是有点累。");
    moods.push("希望能有更多的发展空间。");
    moods.push("团队的氛围挺好的，就是项目进度有点紧。");
  } else {
    moods.push("我对目前的工作还是比较满意的！");
    moods.push("团队氛围不错，领导也很关心我们。");
    moods.push("每天都在进步，感觉很充实！");
  }
  
  // 基于工作强度的反馈
  let sat = calcStaffSaturation(staff);
  if (sat > 130) {
    moods.push("工作量真的太大了，希望能调整一下...");
    suggestions.push("希望能适当减少一些工作量，我可以保证质量。");
    suggestions.push("建议团队再招几个人分担工作。");
  } else if (sat > 110) {
    moods.push("工作比较忙，但还能应付。");
  }
  
  // 基于性格的建议
  if (staff.personality) {
    if (staff.personality.name === "野心勃勃") {
      suggestions.push("我希望能有晋升的机会，不想一直在基层。");
      suggestions.push("公司的晋升机制希望能更透明一些。");
    } else if (staff.personality.name === "积极进取") {
      suggestions.push("希望能参与更有挑战性的项目。");
      suggestions.push("建议多组织一些技术分享会。");
    } else if (staff.personality.name === "敏感脆弱") {
      suggestions.push("希望能得到更多的认可和鼓励。");
      suggestions.push("批评的时候能不能温和一点...");
    }
  }
  
  // 基于等级的建议
  if (staff.level === "C" && staff.workMonths > 3) {
    suggestions.push("我在公司工作一段时间了，希望能有机会晋升。");
    suggestions.push("感觉自己有能力承担更多责任。");
  }
  
  // 基于团队士气的反馈
  if (teamMorale[teamIdx] < 50) {
    suggestions.push("团队最近氛围不太好，希望领导能关注一下。");
    moods.push("团队最近有点低气压...");
  }
  
  let mood = moods[Math.floor(Math.random() * moods.length)];
  let suggestion = suggestions.length > 0 && Math.random() > 0.3 ? suggestions[Math.floor(Math.random() * suggestions.length)] : null;
  
  return { mood, suggestion };
}

// 处理谈话选择
function handleTalkChoice(choice, teamIdx, staffIdx, reportIdx) {
  let staff = teams[teamIdx][staffIdx];
  if (!staff) {
    closeModal();
    return;
  }
  
  let loyaltyChange = 0;
  let message = "";
  
  switch(choice) {
    case 'comfort':
      loyaltyChange = 8 + Math.floor(Math.random() * 8);
      message = `与${staff.name}进行了深入谈话，给予情感支持`;
      staff.loyalty = Math.min(100, staff.loyalty + loyaltyChange);
      break;
      
    case 'accept':
      loyaltyChange = 12 + Math.floor(Math.random() * 9);
      message = `接受了${staff.name}的建议，承诺改进`;
      staff.loyalty = Math.min(100, staff.loyalty + loyaltyChange);
      // 接受建议有小概率提升士气
      if (Math.random() > 0.6) {
        teamMorale[teamIdx] = Math.min(100, teamMorale[teamIdx] + 3);
      }
      break;
      
    case 'ignore':
      loyaltyChange = -3 + Math.floor(Math.random() * 11); // -3到+8
      if (loyaltyChange > 0) {
        message = `委婉地向${staff.name}解释了情况`;
      } else {
        message = `忽视了${staff.name}的建议，员工有些失望`;
      }
      staff.loyalty = Math.max(20, staff.loyalty + loyaltyChange);
      break;
  }
  
  // 记录谈话冷却
  talkCooldowns[staff.id] = history.length;
  
  addLog(`💬 ${message}，忠诚度${loyaltyChange >= 0 ? '+' : ''}${loyaltyChange}`);
  
  closeModal();
  
  // 如果是从HR报告进入的，继续下一个员工
  if (reportIdx >= 0 && window.currentHRReportEmployees && reportIdx < window.currentHRReportEmployees.length - 1) {
    setTimeout(() => {
      showTalkModalFromReport(reportIdx + 1);
    }, 300);
  }
  
  render();
}

// PM半月报告 - 分析部门协调和工作压力
function generatePMReport() {
  if (!pmDepartment) {
    alert("请先建立PM部门！");
    return;
  }
  
  let currentWeek = history.length;
  let currentBiweek = Math.floor(currentWeek / 2);
  
  // 检查是否已经在这个半月报告过
  if (lastPMReportWeek === currentBiweek) {
    alert("本半月已生成过PM报告！");
    return;
  }
  
  lastPMReportWeek = currentBiweek;
  
  // 分析各部门工作量和压力
  let deptAnalysis = [];
  let coordinationIssues = [];
  
  for (let i = 0; i < 4; i++) {
    let team = teams[i];
    let totalWorkload = team.reduce((sum, s) => sum + s.workload, 0);
    let avgWorkload = team.length > 0 ? totalWorkload / team.length : 0;
    let saturation = team.length > 0 ? totalWorkload / TEAMS[i].base : 0;
    let morale = teamMorale[i];
    let efficiency = teamOutputs && teamOutputs[i] ? teamOutputs[i].efficiency : 0.5;
    
    // 判断压力状态
    let pressureStatus = 'normal';
    let pressureScore = 0;
    
    if (avgWorkload > 1.3) {
      pressureStatus = 'high';
      pressureScore = 30;
    } else if (avgWorkload > 1.1) {
      pressureStatus = 'medium';
      pressureScore = 15;
    }
    
    if (morale < 50) pressureScore += 20;
    else if (morale < 70) pressureScore += 10;
    
    if (efficiency < 0.6) pressureScore += 15;
    else if (efficiency < 0.8) pressureScore += 8;
    
    deptAnalysis.push({
      teamIdx: i,
      name: TEAMS[i].name,
      icon: TEAMS[i].icon,
      avgWorkload: avgWorkload,
      saturation: saturation,
      morale: morale,
      efficiency: efficiency,
      pressureStatus: pressureStatus,
      pressureScore: pressureScore,
      staffCount: team.length,
      baseCount: TEAMS[i].base
    });
  }
  
  // 检测部门间协调问题
  // 1. 工作量不平衡
  let workloads = deptAnalysis.map(d => d.avgWorkload);
  let maxWorkload = Math.max(...workloads);
  let minWorkload = Math.min(...workloads);
  
  if (maxWorkload - minWorkload > 0.4) {
    let highTeam = deptAnalysis.find(d => d.avgWorkload === maxWorkload);
    let lowTeam = deptAnalysis.find(d => d.avgWorkload === minWorkload);
    coordinationIssues.push({
      type: 'workload_imbalance',
      severity: 'high',
      title: '工作量分配不均',
      description: `${highTeam.name}部门平均工作量(${highTeam.avgWorkload.toFixed(2)})远高于${lowTeam.name}部门(${lowTeam.avgWorkload.toFixed(2)})`,
      suggestion: `建议调整${highTeam.name}部门工作量或向其调配人手`,
      affectedTeams: [highTeam.teamIdx, lowTeam.teamIdx]
    });
  }
  
  // 2. 士气差异过大
  let morales = deptAnalysis.map(d => d.morale);
  let maxMorale = Math.max(...morales);
  let minMorale = Math.min(...morales);
  
  if (maxMorale - minMorale > 30) {
    let lowTeam = deptAnalysis.find(d => d.morale === minMorale);
    coordinationIssues.push({
      type: 'morale_gap',
      severity: 'medium',
      title: '部门士气差异明显',
      description: `${lowTeam.name}部门士气(${lowTeam.morale.toFixed(0)})明显低于其他部门`,
      suggestion: `建议对${lowTeam.name}部门进行团队建设或调整管理方式`,
      affectedTeams: [lowTeam.teamIdx]
    });
  }
  
  // 3. 效率瓶颈
  let lowEffTeams = deptAnalysis.filter(d => d.efficiency < 0.6);
  if (lowEffTeams.length > 0) {
    coordinationIssues.push({
      type: 'efficiency_bottleneck',
      severity: 'high',
      title: '部门效率瓶颈',
      description: `${lowEffTeams.map(t => t.name).join('、')}部门效率低于60%`,
      suggestion: '建议检查这些部门的人员配置和工作流程',
      affectedTeams: lowEffTeams.map(t => t.teamIdx)
    });
  }
  
  // 4. 人手不足预警
  let understaffed = deptAnalysis.filter(d => d.staffCount < d.baseCount * 0.8);
  if (understaffed.length > 0) {
    coordinationIssues.push({
      type: 'understaffed',
      severity: 'medium',
      title: '人手不足预警',
      description: `${understaffed.map(t => t.name).join('、')}部门人员不足基准的80%`,
      suggestion: '建议优先招聘补充人手',
      affectedTeams: understaffed.map(t => t.teamIdx)
    });
  }
  
  // 5. 部门配合效率问题（基于历史数据模拟）
  if (teamOutputs) {
    let totalEff = deptAnalysis.reduce((sum, d) => sum + d.efficiency, 0);
    let avgEff = totalEff / 4;
    let variance = deptAnalysis.reduce((sum, d) => sum + Math.pow(d.efficiency - avgEff, 2), 0) / 4;
    
    if (variance > 0.05) {
      coordinationIssues.push({
        type: 'coordination_friction',
        severity: 'medium',
        title: '部门配合存在摩擦',
        description: '各部门效率差异较大，可能存在协作不畅',
        suggestion: '建议召开跨部门协调会议，明确职责分工',
        affectedTeams: [0, 1, 2, 3]
      });
    }
  }
  
  // 生成报告
  let report = {
    week: currentWeek,
    deptAnalysis: deptAnalysis,
    coordinationIssues: coordinationIssues,
    issueCount: coordinationIssues.length,
    highSeverity: coordinationIssues.filter(i => i.severity === 'high').length,
    mediumSeverity: coordinationIssues.filter(i => i.severity === 'medium').length
  };
  
  pmReports.push(report);
  
  // 显示报告弹窗
  showPMReportModal(report);
}

// 显示PM报告弹窗
function showPMReportModal(report) {
  document.getElementById('modalMask').classList.add('show');
  document.getElementById('modalBox').className = 'modal-box';
  
  let riskIcon = report.highSeverity > 0 ? '🚨' : report.mediumSeverity > 0 ? '⚠️' : '✅';
  
  document.getElementById('modalBox').innerHTML = `
    <div style="background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); border-radius: 16px; padding: 24px; max-width: 600px;">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 48px; margin-bottom: 12px;">${riskIcon}</div>
        <div style="font-size: 20px; font-weight: 700; color: white;">PM项目协调报告</div>
        <div style="font-size: 14px; color: #94a3b8;">第 ${report.week + 1} 周</div>
      </div>
      
      <!-- 部门分析 -->
      <div style="background: rgba(255,255,255,0.1); border-radius: 10px; padding: 14px; margin-bottom: 16px;">
        <div style="font-size: 14px; font-weight: 600; color: #fbbf24; margin-bottom: 12px;">📊 部门工作量分析</div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
          ${report.deptAnalysis.map(d => `
            <div style="background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span style="font-size: 14px; color: #e2e8f0;">${d.icon} ${d.name}</span>
                <span style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background: ${d.pressureStatus === 'high' ? '#ef4444' : d.pressureStatus === 'medium' ? '#f59e0b' : '#10b981'}; color: white;">
                  ${d.pressureStatus === 'high' ? '高压' : d.pressureStatus === 'medium' ? '中等' : '正常'}
                </span>
              </div>
              <div style="font-size: 12px; color: #94a3b8;">
                工作量: <span style="color: ${d.avgWorkload > 1.2 ? '#f87171' : '#e2e8f0'}">${(d.avgWorkload * 100).toFixed(0)}%</span> |
                士气: <span style="color: ${d.morale < 50 ? '#f87171' : '#e2e8f0'}">${d.morale.toFixed(0)}</span> |
                效率: <span style="color: ${d.efficiency < 0.6 ? '#f87171' : '#4ade80'}">${(d.efficiency * 100).toFixed(0)}%</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      
      <!-- 协调问题 -->
      ${report.coordinationIssues.length > 0 ? `
        <div style="background: rgba(239, 68, 68, 0.1); border-radius: 10px; padding: 14px; margin-bottom: 16px;">
          <div style="font-size: 14px; font-weight: 600; color: #f87171; margin-bottom: 12px;">⚠️ 发现协调问题 (${report.coordinationIssues.length}项)</div>
          ${report.coordinationIssues.map((issue, idx) => `
            <div style="background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; margin-bottom: 8px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="font-size: 13px; font-weight: 600; color: #e2e8f0;">${issue.title}</span>
                <span style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background: ${issue.severity === 'high' ? '#ef4444' : '#f59e0b'}; color: white;">
                  ${issue.severity === 'high' ? '严重' : '中等'}
                </span>
              </div>
              <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">${issue.description}</div>
              <div style="font-size: 12px; color: #4ade80;">💡 ${issue.suggestion}</div>
            </div>
          `).join('')}
        </div>
      ` : '<div style="text-align: center; color: #10b981; padding: 16px; background: rgba(16, 185, 129, 0.1); border-radius: 10px; margin-bottom: 16px;">✅ 部门协调良好，暂无明显问题</div>'}
      
      <!-- 决策选项 -->
      ${report.coordinationIssues.length > 0 ? `
        <div style="font-size: 14px; font-weight: 600; color: #fbbf24; margin-bottom: 12px;">🎯 策略决策</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          ${report.coordinationIssues.map((issue, idx) => `
            <button onclick="handlePMDecision(${idx}, 'resolve')" style="padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, #10b981 0%, #34d399 100%); color: white; font-weight: 600; cursor: pointer; text-align: left;">
              🔧 解决「${issue.title}」<br>
              <span style="font-size: 11px; opacity: 0.8;">${issue.suggestion}</span>
            </button>
          `).join('')}
          <button onclick="handlePMDecision(-1, 'skip')" style="padding: 12px; border-radius: 8px; border: 1px solid #6b7280; background: transparent; color: #94a3b8; cursor: pointer;">
            暂不处理
          </button>
        </div>
      ` : `
        <button onclick="closeModal()" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, #10b981 0%, #34d399 100%); color: white; font-weight: 600; cursor: pointer;">
          确认
        </button>
      `}
    </div>
  `;
  
  // 保存当前报告供决策使用
  window.currentPMReport = report;
}

// 处理PM决策
function handlePMDecision(issueIdx, action) {
  if (!window.currentPMReport) {
    closeModal();
    return;
  }
  
  if (action === 'skip') {
    addLog(`📋 PM报告：暂不处理协调问题`);
    closeModal();
    render();
    return;
  }
  
  let issue = window.currentPMReport.coordinationIssues[issueIdx];
  if (!issue) {
    closeModal();
    return;
  }
  
  let bonusGain = 0;
  let message = '';
  
  // 根据问题类型给予不同的增益
  switch (issue.type) {
    case 'workload_imbalance':
      bonusGain = 3 + Math.floor(Math.random() * 3);
      pmBonuses.efficiency += bonusGain;
      // 自动调整工作量
      for (let teamIdx of issue.affectedTeams) {
        teams[teamIdx].forEach(s => {
          if (s.workload > 1.2) s.workload = Math.max(0.8, s.workload - 0.1);
        });
      }
      message = `平衡了${issue.affectedTeams.map(i => TEAMS[i].name).join('、')}部门工作量`;
      break;
      
    case 'morale_gap':
      bonusGain = 2 + Math.floor(Math.random() * 2);
      pmBonuses.coordination += bonusGain;
      // 提升低士气部门士气
      for (let teamIdx of issue.affectedTeams) {
        teamMorale[teamIdx] = Math.min(100, teamMorale[teamIdx] + 10);
      }
      message = `改善了${issue.affectedTeams.map(i => TEAMS[i].name).join('、')}部门士气`;
      break;
      
    case 'efficiency_bottleneck':
      bonusGain = 4 + Math.floor(Math.random() * 3);
      pmBonuses.efficiency += bonusGain;
      // 提升效率低下部门的士气
      for (let teamIdx of issue.affectedTeams) {
        teamMorale[teamIdx] = Math.min(100, teamMorale[teamIdx] + 5);
      }
      message = `优化了${issue.affectedTeams.map(i => TEAMS[i].name).join('、')}部门工作流程`;
      break;
      
    case 'understaffed':
      bonusGain = 2 + Math.floor(Math.random() * 2);
      pmBonuses.coordination += bonusGain;
      message = `已记录人手需求，建议尽快招聘`;
      break;
      
    case 'coordination_friction':
      bonusGain = 3 + Math.floor(Math.random() * 3);
      pmBonuses.coordination += bonusGain;
      pmBonuses.efficiency += 2;
      // 全部门士气微升
      for (let i = 0; i < 4; i++) {
        teamMorale[i] = Math.min(100, teamMorale[i] + 3);
      }
      message = `召开跨部门协调会议，改善了部门配合`;
      break;
      
    default:
      bonusGain = 2;
      pmBonuses.efficiency += bonusGain;
      message = `处理了${issue.title}`;
  }
  
  // PM领导能力加成
  if (pmDepartment && pmDepartment.leader) {
    let leaderBonus = pmDepartment.leader.ability;
    bonusGain = Math.floor(bonusGain * leaderBonus);
  }
  
  addLog(`📋 PM决策：${message}，项目增益+${bonusGain}%`);
  
  closeModal();
  render();
}

function setAdStrategy(strategy) { adStrategy = strategy; refreshAllMorale(); render(); }
function toggleChannel(id) { let c = adChannels.find(c => c.id === id); if (c) { c.active = !c.active; render(); } }
function setChannelBudget(id, value) { let c = adChannels.find(c => c.id === id); if (c) { c.budget = Math.max(0, parseInt(value) || 0); render(); } }

function selectProject(idx) {
  projectTypeIdx = idx;
  project = { progress: 0, planProgress: 0, quality: 5.0 };
  history = [];
  diagnoseArr = [];
  running = true;
  teamOutputs = null;
  addLog(`选择项目类型：${PROJECT_TYPES[idx].name}`);
  document.getElementById("projectSelectCard").style.display = "none";
  render();
}

function restart() {
  money = INIT_MONEY;
  teams = [[], [], [], [], [], []]; // 6个团队（美术、程序、发行、策划、人事、PM）
  logTxt = "公司成立，启动资金500万，6个月内完成游戏Demo并达成各阶段目标！最终成绩取最后8周平均值！";
  running = false;
  project = null;
  history = [];
  diagnoseArr = [];
  projectTypeIdx = 0;
  teamMorale = [60, 60, 60, 60, 60, 60];
  transferBudget = MONTH_BUDGET_TRANSFER;
  recruitBudget = MONTH_BUDGET_RECRUIT;
  leaderBudget = LEADER_SELECT_BUDGET;
  leaders = [null, null, null, null, null, null];
  leaderActionTimes = [1, 1, 1, 1, 1, 1];
  leaderEncourageTimes = [1, 1, 1, 1, 1, 1];
  leaderPressureFlag = [false, false, false, false, false, false];
  leaderEncourageFlag = [false, false, false, false, false, false];
  leaderSelecting = true;
  leaderSelectIdx = 0;
  staffNamesUsed = [];
  adChannels = AD_CHANNELS.map(c => ({...c}));
  adStrategy = 'balanced';
  marketTests = [];
  chartInstance = null;
  weekResultData = null;
  teamOutputs = null;
  lastMonth = -1;
  hasDoneMarketResearch = {audience:false, competitor:false, trend:false, pricing:false};
  trainingBonus = [0, 0, 0, 0, 0, 0];
  resignationQueue = [];
  
  // 市场测试月度限制
  monthlyMarketTestsUsed = {audience:false, competitor:false, trend:false, pricing:false};
  currentMonth = 0;
  
  // HR系统
  hrDepartment = null;
  hrReports = [];
  pendingResignations = [];
  lastHRReportWeek = -1;
  
  // PM系统
  pmDepartment = null;
  pmReports = [];
  lastPMReportWeek = -1;
  pmBonuses = { efficiency: 0, coordination: 0 };
  pendingPMDecisions = [];
  
  // 员工谈话
  talkCooldowns = {};
  
  showGuide('welcome');
  render();
}

restart();
</script>
